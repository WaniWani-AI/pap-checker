name: Research scan

# Runs the insurers-and-banks study: every host in research/targets.json
# through the public checker, three times a day, eight hours apart. Each
# run commits its raw results and the updated summary to main.
on:
  schedule:
    - cron: "17 1,9,17 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: research-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Scan every target host
        run: node scripts/scan.mjs

      - name: Rebuild the summary
        run: node scripts/summarize.mjs

      - name: Commit the results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/results research/summary.json research/summary.csv
          if git diff --cached --quiet; then
            echo "No new results"
            exit 0
          fi
          git commit -m "Research scan $(date -u +%Y-%m-%dT%H:%MZ)"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && break
            sleep 5
          done
